
<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BOOKLY - Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary px-4">

    <a class="navbar-brand logo" href="index.html">
        BOOK<span>LY.</span>
    </a>

    <div class="navbar-nav ms-auto">
        <a class="nav-link" href="../index.html">Үндсэн сайт</a>
        <a class="nav-link" href="../books.html">Номууд</a>
    </div>

</nav>

<main class="container py-5">

    <div class="row align-items-center g-5 py-5">

        <div class="col-lg-6">

            <p class="eyebrow">BOOTSTRAP 5.3 VERSION</p>

            <h1 class="display-2" style="font-family:var(--serif)">
                Read beyond<br>
                <em style="color:var(--gold)">the ordinary.</em>
            </h1>

            <p class="text-secondary my-4">
                Bootstrap Grid, Navbar, Spacing болон Card систем
                ашигласан BOOKLY нүүр хуудас.
            </p>

            <a href="../books.html" class="btn btn-warning">
                Ном үзэх ↗
            </a>

        </div>

        <div class="col-lg-6">

            <img
                class="img-fluid shadow"
                src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=900"
                alt="Номын зураг">

        </div>

    </div>

    <h2 class="mb-4" style="font-family:var(--serif)">
        Онцлох номууд
    </h2>

    <div class="row g-4">

        <div class="col-6 col-lg-3">
            <div class="card bg-dark text-light border-secondary">
                <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=500" class="card-img-top" alt="Ном">
                <div class="card-body">
                    <h5>Атомын дадал</h5>
                    <p class="text-secondary">35,000₮</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card bg-dark text-light border-secondary">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=500" class="card-img-top" alt="Ном">
                <div class="card-body">
                    <h5>Сэтгэж баяж</h5>
                    <p class="text-secondary">32,000₮</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card bg-dark text-light border-secondary">
                <img src="https://images.unsplash.com/photo-1532012197267-da84d127e765?w=500" class="card-img-top" alt="Ном">
                <div class="card-body">
                    <h5>Ирээдүйн код</h5>
                    <p class="text-secondary">42,000₮</p>
                </div>
            </div>
        </div>

        <div class="col-6 col-lg-3">
            <div class="card bg-dark text-light border-secondary">
                <img src="https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=500" class="card-img-top" alt="Ном">
                <div class="card-body">
                    <h5>Жижиг ханхүү</h5>
                    <p class="text-secondary">24,000₮</p>
                </div>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
